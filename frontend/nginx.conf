server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /user {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /shop {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /shop-type {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /blog {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /blogs {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /follow {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /voucher {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /voucher-order {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /upload {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location /rag/chat/stream {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /rag {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }
}
